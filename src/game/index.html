<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Atari Breakout - MCP App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Arcade screen cabinet and responsive canvas container */
    #arcade-cabinet {
      position: relative;
      border: 3px solid #333333;
      background-color: #050505;
      padding: 4px;
      box-shadow: 0 0 25px rgba(0, 255, 128, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.9);
      border-radius: 6px;
      width: 96vw;
      max-width: 800px;
      height: 82vh;
      max-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Optimized CRT Scanline & Phosphor Grid Overlay */
    #scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.04),
        rgba(0, 255, 0, 0.02),
        rgba(0, 0, 255, 0.04)
      );
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
      z-index: 10;
      will-change: transform;
    }

    /* In-App Retro Settings Drawer / Modal */
    #settings-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 4px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 3px;
      letter-spacing: 1px;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    #settings-btn:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 10px #00ff66;
    }

    #settings-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .settings-panel {
      background: #0a0a0a;
      border: 2px solid #00ff66;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
      padding: 18px 24px;
      border-radius: 6px;
      width: 90%;
      max-width: 440px;
    }

    .settings-title {
      color: #00ff66;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 2px;
      border-bottom: 1px solid #222;
      padding-bottom: 8px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .setting-label {
      color: #ddd;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .setting-val {
      color: #00ccff;
      font-weight: bold;
      margin-left: 8px;
      min-width: 45px;
      text-align: right;
    }

    .slider {
      flex: 1;
      margin: 0 10px;
      accent-color: #00ff66;
      cursor: pointer;
    }

    .btn-toggle {
      background: #1a1a1a;
      border: 1px solid #555;
      color: #888;
      padding: 4px 10px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-toggle.active {
      background: #00ff66;
      color: #000;
      border-color: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    .cheats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      margin-bottom: 14px;
    }

    .cheat-btn {
      background: #151515;
      border: 1px solid #ff007f;
      color: #ff007f;
      padding: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .cheat-btn:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 10px #ff007f;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      text-align: center;
    }

    .btn-close {
      background: #00ff66;
      color: #000;
      border: 1px solid #00ff66;
    }

    .btn-restart {
      background: #222;
      color: #ff0040;
      border: 1px solid #ff0040;
    }

    /* Controls tip & status bar */
    #controls-tip {
      margin-top: 6px;
      font-size: 11px;
      color: #aaaaaa;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      background: #222222;
      color: #00ff66;
      border: 1px solid #00ff66;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div id="arcade-cabinet">
    <div id="scanlines"></div>
    <button id="settings-btn">⚙️ SETTINGS</button>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- In-App Settings Drawer -->
    <div id="settings-modal">
      <div class="settings-panel">
        <div class="settings-title">🕹️ ARCADE SETTINGS</div>
        
        <div class="setting-row">
          <span class="setting-label">PADDLE:</span>
          <input type="range" id="paddle-slider" class="slider" min="80" max="250" value="120">
          <span id="paddle-val" class="setting-val">120px</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">SPEED:</span>
          <input type="range" id="speed-slider" class="slider" min="3" max="9" step="0.5" value="5.5">
          <span id="speed-val" class="setting-val">5.5</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">AI AUTOPILOT:</span>
          <button id="toggle-autopilot" class="btn-toggle">OFF</button>
        </div>

        <div class="setting-row">
          <span class="setting-label">GOD MODE (FLOOR BOUNCE):</span>
          <button id="toggle-godmode" class="btn-toggle">OFF</button>
        </div>

        <div style="font-size: 10px; color: #888; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase;">Instant Cheats:</div>
        <div class="cheats-grid">
          <button class="cheat-btn" id="cheat-laser">💥 Laser Paddle</button>
          <button class="cheat-btn" id="cheat-life">💖 +1 Extra Life</button>
          <button class="cheat-btn" id="cheat-slow">🐢 Slow Ball</button>
          <button class="cheat-btn" id="cheat-skip">⏭️ Skip Level</button>
        </div>

        <div class="action-row">
          <button id="btn-resume" class="btn-action btn-close">▶️ RESUME</button>
          <button id="btn-newgame" class="btn-action btn-restart">🔄 NEW GAME</button>
        </div>
      </div>
    </div>
  </div>

  <div id="controls-tip">
    ◄ LEFT / RIGHT ► Keys • SPACE to Launch/Pause • Press [ESC] for Settings
    <span id="ai-status" class="badge" style="display:none;">AI AUTOPILOT ACTIVE</span>
  </div>

  <script>
    /**
     * Complete, Spec-Compliant MCP Apps Protocol Bridge with Session Continuity
     */
    class MCPAppsBridge {
      constructor() {
        this.connected = false;
        this.initialized = false;
        this.initRequestId = 1;
        this.hostContext = {};
        this.ontoolresult = null;

        window.addEventListener("message", (event) => {
          this.handleIncomingMessage(event);
        });

        this.sendInitialize();
        this.sendInitializedNotification();
        setTimeout(() => this.sendInitializedNotification(), 50);
        setTimeout(() => this.sendInitializedNotification(), 250);
      }

      sendInitialize() {
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage({
            jsonrpc: "2.0",
            id: this.initRequestId,
            method: "ui/initialize",
            params: {
              protocolVersion: "2024-11-05",
              appInfo: { name: "retro-breakout", version: "1.2.0" },
              appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] }
            }
          }, "*");
          this.connected = true;
        } catch (err) {
          console.warn("[MCP Bridge] Running in isolated mode.", err);
        }
      }

      sendInitializedNotification() {
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/initialized",
            params: {}
          }, "*");
          this.initialized = true;
        } catch (err) {
          console.warn("[MCP Bridge] Failed to send initialized notification:", err);
        }
      }

      handleIncomingMessage(event) {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.id === this.initRequestId && data.result) {
          this.hostContext = data.result.hostContext || {};
          this.sendInitializedNotification();
        }

        if (data.method === "ui/notifications/tool-result" || data.method === "tools/call_result") {
          this.sendInitializedNotification();
          const result = data.params?.result || data.params || data.result;
          this.processToolPayload(result);
        }

        if (data.result && (data.result.content || data.result._meta)) {
          this.sendInitializedNotification();
          this.processToolPayload(data.result);
        }

        if (data.method === "ui/notifications/host-context-changed") {
          this.hostContext = data.params || {};
        }

        if (data.method === "ping" && event.source && data.id) {
          this.sendInitializedNotification();
          event.source.postMessage({ jsonrpc: "2.0", id: data.id, result: {} }, "*");
        }
      }

      processToolPayload(payload) {
        if (!payload) return;
        try {
          let rawText = "";
          if (Array.isArray(payload.content)) {
            for (const item of payload.content) {
              if (item.type === "text" && item.text) rawText += item.text;
            }
          } else if (typeof payload.text === "string") {
            rawText = payload.text;
          } else if (typeof payload === "string") {
            rawText = payload;
          }

          if (rawText && rawText.includes("{") && rawText.includes("}")) {
            const startIdx = rawText.indexOf("{");
            const endIdx = rawText.lastIndexOf("}") + 1;
            const parsed = JSON.parse(rawText.substring(startIdx, endIdx));
            if (this.ontoolresult) this.ontoolresult(parsed);
          }
        } catch (e) {
          console.warn("[MCP Bridge] Error parsing tool result payload:", e);
        }
      }

      async updateModelContext(messageText, metadata = {}) {
        if (!window.parent || window.parent === window) return;
        try {
          window.parent.postMessage({
            jsonrpc: "2.0",
            method: "ui/notifications/context-update",
            params: {
              content: [{ type: "text", text: messageText }],
              _meta: metadata
            }
          }, "*");
        } catch (e) {
          console.warn("[MCP Bridge] Failed to send context update to host:", e);
        }
      }
    }

    const mcp = new MCPAppsBridge();

    // Canvas Context
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const aiStatusBadge = document.getElementById('ai-status');

    // UI Drawer Elements
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const paddleSlider = document.getElementById('paddle-slider');
    const paddleVal = document.getElementById('paddle-val');
    const speedSlider = document.getElementById('speed-slider');
    const speedVal = document.getElementById('speed-val');
    const toggleAutopilot = document.getElementById('toggle-autopilot');
    const toggleGodmode = document.getElementById('toggle-godmode');
    const btnResume = document.getElementById('btn-resume');
    const btnNewGame = document.getElementById('btn-newgame');

    // Live Game Configuration
    const config = {
      paddleSize: 120,
      ballSpeed: 5.5,
      lives: 3,
      autopilot: false,
      godMode: false
    };

    // Game State
    let score = 0;
    let highScore = 0;
    try {
      highScore = Number(localStorage.getItem('breakout_high_score') || 0);
    } catch(e) {}

    let currentLives = config.lives;
    let isPaused = true;
    let isSettingsOpen = false;
    let gameOver = false;
    let gameWon = false;
    let isResumedSession = false;
    let level = 1;
    let lastSentScore = 0;

    // Paddle
    const paddle = {
      x: canvas.width / 2 - config.paddleSize / 2,
      y: canvas.height - 38,
      width: config.paddleSize,
      height: 14,
      speed: 8.5
    };

    // Ball
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 56,
      radius: 7,
      speed: config.ballSpeed,
      dx: 0,
      dy: 0,
      active: false
    };

    // Bricks Grid
    const brickRowCount = 5;
    const brickColumnCount = 10;
    const brickWidth = 72;
    const brickHeight = 18;
    const brickPadding = 4;
    const brickOffsetTop = 95;
    const brickOffsetLeft = 24;

    const rowProperties = [
      { color: '#ff0040', points: 7 }, // Red
      { color: '#ff7700', points: 5 }, // Orange
      { color: '#ffcc00', points: 3 }, // Yellow
      { color: '#00ff66', points: 2 }, // Green
      { color: '#00ccff', points: 1 }  // Cyan
    ];

    let bricks = [];
    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = {
            x: (c * (brickWidth + brickPadding)) + brickOffsetLeft,
            y: (r * (brickHeight + brickPadding)) + brickOffsetTop,
            status: 1,
            color: rowProperties[r].color,
            points: rowProperties[r].points
          };
        }
      }
    }

    // --- Session Storage State Persistence & Continuity ---
    const STORAGE_KEY = 'mcp_breakout_session_state';

    function saveGameState() {
      try {
        const brickStatusMatrix = [];
        for (let c = 0; c < brickColumnCount; c++) {
          brickStatusMatrix[c] = [];
          for (let r = 0; r < brickRowCount; r++) {
            brickStatusMatrix[c][r] = bricks[c] && bricks[c][r] ? bricks[c][r].status : 0;
          }
        }

        const statePayload = {
          score: score,
          currentLives: currentLives,
          level: level,
          gameOver: gameOver,
          gameWon: gameWon,
          config: config,
          brickMatrix: brickStatusMatrix,
          timestamp: Date.now()
        };

        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(statePayload));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(statePayload));
      } catch (e) {}
    }

    function loadGameState() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        if (!saved) return false;

        // If previous game was over or expired (> 3 hours), start fresh
        if (saved.gameOver || (Date.now() - (saved.timestamp || 0) > 3 * 3600 * 1000)) {
          return false;
        }

        // Restore active game progress
        score = saved.score || 0;
        currentLives = Math.max(1, saved.currentLives !== undefined ? saved.currentLives : 3);
        level = saved.level || 1;
        gameWon = Boolean(saved.gameWon);
        gameOver = false;

        if (saved.config) {
          applyConfiguration(saved.config, false);
        }

        // Restore brick status matrix
        if (saved.brickMatrix && Array.isArray(saved.brickMatrix)) {
          initBricks();
          for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
              if (saved.brickMatrix[c] && saved.brickMatrix[c][r] !== undefined) {
                bricks[c][r].status = saved.brickMatrix[c][r];
              }
            }
          }
        }

        isResumedSession = score > 0 || level > 1;
        return true;
      } catch (e) {
        return false;
      }
    }

    function clearGameState() {
      try {
        sessionStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
    }

    // Particle Object Pool
    const MAX_PARTICLES = 250;
    const particlePool = [];
    for (let i = 0; i < MAX_PARTICLES; i++) {
      particlePool.push({
        active: false,
        x: 0,
        y: 0,
        size: 0,
        color: '#fff',
        vx: 0,
        vy: 0,
        alpha: 1.0,
        decay: 0.02
      });
    }

    function spawnExplosion(x, y, color, count = 16) {
      let spawned = 0;
      for (let i = 0; i < MAX_PARTICLES && spawned < count; i++) {
        const p = particlePool[i];
        if (!p.active) {
          p.active = true;
          p.x = x;
          p.y = y;
          p.size = Math.random() * 4 + 2.5;
          p.color = color;
          p.vx = (Math.random() - 0.5) * 7;
          p.vy = (Math.random() - 0.5) * 7 - 2;
          p.alpha = 1.0;
          p.decay = Math.random() * 0.025 + 0.018;
          spawned++;
        }
      }
    }

    function updateParticles(dt) {
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = particlePool[i];
        if (p.active) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 0.15 * dt;
          p.alpha -= p.decay * dt;
          if (p.alpha <= 0) p.active = false;
        }
      }
    }

    function drawParticles() {
      for (let i = 0; i < MAX_PARTICLES; i++) {
        const p = particlePool[i];
        if (p.active) {
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
      }
      ctx.globalAlpha = 1.0;
    }

    // Input Handling
    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        toggleSettingsDrawer();
        return;
      }
      if (isSettingsOpen) return;

      if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = true;
      } else if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = true;
      } else if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        if (gameOver || gameWon) {
          resetGame(true);
        } else if (!ball.active) {
          launchBall();
        } else {
          isPaused = !isPaused;
        }
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
      if (e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
    });

    function handlePointer(clientX) {
      if (config.autopilot || isSettingsOpen) return;
      const rect = canvas.getBoundingClientRect();
      const relativeX = (clientX - rect.left) * (canvas.width / rect.width);
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, relativeX - paddle.width / 2));
    }

    canvas.addEventListener("mousemove", (e) => handlePointer(e.clientX));
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches[0]) handlePointer(e.touches[0].clientX);
    }, { passive: true });

    canvas.addEventListener("click", () => {
      if (isSettingsOpen) return;
      if (gameOver || gameWon) {
        resetGame(true);
      } else if (!ball.active) {
        launchBall();
      }
    });

    function launchBall() {
      ball.active = true;
      ball.speed = config.ballSpeed;
      ball.dx = (Math.random() * 2 - 1) * ball.speed * 0.6;
      ball.dy = -ball.speed;
      isPaused = false;
      isResumedSession = false;
    }

    function resetBallPaddle() {
      paddle.x = canvas.width / 2 - paddle.width / 2;
      ball.x = canvas.width / 2;
      ball.y = paddle.y - ball.radius - 2;
      ball.dx = 0;
      ball.dy = 0;
      ball.active = false;
    }

    function resetGame(fullReset = false) {
      if (fullReset) {
        score = 0;
        level = 1;
        currentLives = config.lives;
        clearGameState();
      }
      gameOver = false;
      gameWon = false;
      isPaused = true;
      isResumedSession = false;
      initBricks();
      resetBallPaddle();
      saveGameState();
    }

    // Apply Live Configuration Updates (from LLM or HUD)
    function applyConfiguration(newConfig, shouldSave = true) {
      if (!newConfig) return;

      if (newConfig.paddleSize !== undefined || newConfig.paddleWidth !== undefined) {
        const newSize = Number(newConfig.paddleSize || newConfig.paddleWidth);
        const diff = newSize - paddle.width;
        paddle.width = newSize;
        config.paddleSize = newSize;
        paddle.x -= diff / 2;
        if (paddleSlider) paddleSlider.value = newSize;
        if (paddleVal) paddleVal.textContent = newSize + "px";
      }
      if (newConfig.ballSpeed !== undefined) {
        config.ballSpeed = Number(newConfig.ballSpeed);
        if (speedSlider) speedSlider.value = config.ballSpeed;
        if (speedVal) speedVal.textContent = config.ballSpeed;
        if (ball.active) {
          const currentSpeed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
          if (currentSpeed > 0) {
            ball.dx = (ball.dx / currentSpeed) * config.ballSpeed;
            ball.dy = (ball.dy / currentSpeed) * config.ballSpeed;
          }
        }
      }
      if (newConfig.lives !== undefined) {
        const diff = Number(newConfig.lives) - config.lives;
        config.lives = Number(newConfig.lives);
        currentLives = Math.max(1, currentLives + diff);
      }
      if (newConfig.autopilot !== undefined) {
        config.autopilot = Boolean(newConfig.autopilot);
        if (aiStatusBadge) aiStatusBadge.style.display = config.autopilot ? 'inline-block' : 'none';
        if (toggleAutopilot) {
          toggleAutopilot.textContent = config.autopilot ? "ON" : "OFF";
          toggleAutopilot.classList.toggle("active", config.autopilot);
        }
      }
      if (newConfig.godMode !== undefined) {
        config.godMode = Boolean(newConfig.godMode);
        if (toggleGodmode) {
          toggleGodmode.textContent = config.godMode ? "ON" : "OFF";
          toggleGodmode.classList.toggle("active", config.godMode);
        }
      }

      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      if (shouldSave) saveGameState();
    }

    function handleCheat(cheat) {
      if (cheat === "god_mode" || cheat === "godMode") {
        applyConfiguration({ godMode: true });
        spawnExplosion(paddle.x + paddle.width / 2, paddle.y, "#00ffff", 25);
      } else if (cheat === "extra_ball" || cheat === "extraBall") {
        currentLives += 1;
        saveGameState();
        spawnExplosion(canvas.width / 2, 45, "#ffffff", 20);
      } else if (cheat === "slow_ball" || cheat === "slowBall") {
        applyConfiguration({ ballSpeed: 3.5 });
      } else if (cheat === "laser_paddle" || cheat === "laserPaddle") {
        applyConfiguration({ paddleSize: 240 });
        spawnExplosion(paddle.x + paddle.width / 2, paddle.y, "#ff00ff", 30);
      } else if (cheat === "win_level" || cheat === "levelBypass") {
        winLevel();
      }
    }

    mcp.ontoolresult = (data) => {
      if (data.settings) applyConfiguration(data.settings);
      if (data.cheatApplied) handleCheat(data.cheatApplied);
    };

    function winLevel() {
      gameWon = true;
      isPaused = true;
      ball.active = false;
      saveGameState();
      spawnExplosion(canvas.width / 2, canvas.height / 2, '#00ff66', 40);
      mcp.updateModelContext(
        `[BREAKOUT GAME EVENT: LEVEL_CLEARED] The player completed Level ${level} with a score of ${score}! Suggest they attempt Level ${level + 1} with higher ball speed!`
      );
    }

    function triggerGameOver() {
      gameOver = true;
      isPaused = true;
      ball.active = false;
      clearGameState(); // Clear in-progress session so next game starts fresh
      spawnExplosion(ball.x, ball.y, '#ff003c', 35);
      if (score > highScore) {
        highScore = score;
        try { localStorage.setItem('breakout_high_score', score); } catch(e) {}
      }
      mcp.updateModelContext(
        `[BREAKOUT GAME EVENT: GAME_OVER] The player met their doom with a final score of ${score} on Level ${level}. Encourage them to play again!`
      );
    }

    // In-App Settings Drawer Interactions
    function toggleSettingsDrawer() {
      isSettingsOpen = !isSettingsOpen;
      settingsModal.style.display = isSettingsOpen ? 'flex' : 'none';
      if (isSettingsOpen) isPaused = true;
    }

    settingsBtn.addEventListener('click', toggleSettingsDrawer);
    btnResume.addEventListener('click', toggleSettingsDrawer);
    btnNewGame.addEventListener('click', () => {
      toggleSettingsDrawer();
      resetGame(true);
    });

    paddleSlider.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      applyConfiguration({ paddleSize: val });
    });

    speedSlider.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      applyConfiguration({ ballSpeed: val });
    });

    toggleAutopilot.addEventListener('click', () => {
      applyConfiguration({ autopilot: !config.autopilot });
      mcp.updateModelContext(`[USER ACTION] Autopilot set to ${config.autopilot ? 'ON' : 'OFF'}`);
    });

    toggleGodmode.addEventListener('click', () => {
      applyConfiguration({ godMode: !config.godMode });
      mcp.updateModelContext(`[USER ACTION] God Mode set to ${config.godMode ? 'ON' : 'OFF'}`);
    });

    document.getElementById('cheat-laser').addEventListener('click', () => handleCheat('laser_paddle'));
    document.getElementById('cheat-life').addEventListener('click', () => handleCheat('extra_ball'));
    document.getElementById('cheat-slow').addEventListener('click', () => handleCheat('slow_ball'));
    document.getElementById('cheat-skip').addEventListener('click', () => handleCheat('win_level'));

    // Physics & Collision Loop
    function updatePhysics(dt) {
      if (isPaused || isSettingsOpen || gameOver || gameWon) return;

      if (config.autopilot && ball.active) {
        const paddleCenter = paddle.x + paddle.width / 2;
        const diff = ball.x - paddleCenter;
        const maxStep = paddle.speed * 1.2 * dt;
        if (Math.abs(diff) > 4) {
          paddle.x += Math.sign(diff) * Math.min(Math.abs(diff), maxStep);
        }
      } else {
        if (rightPressed && paddle.x < canvas.width - paddle.width) {
          paddle.x += paddle.speed * dt;
        } else if (leftPressed && paddle.x > 0) {
          paddle.x -= paddle.speed * dt;
        }
      }

      if (ball.active) {
        ball.x += ball.dx * dt;
        ball.y += ball.dy * dt;

        if (ball.x - ball.radius <= 0) {
          ball.x = ball.radius;
          ball.dx = -ball.dx;
        } else if (ball.x + ball.radius >= canvas.width) {
          ball.x = canvas.width - ball.radius;
          ball.dx = -ball.dx;
        }

        if (ball.y - ball.radius <= 70) {
          ball.y = 70 + ball.radius;
          ball.dy = -ball.dy;
        }

        const paddleTop = paddle.y;
        if (ball.y + ball.radius >= paddleTop && ball.y - ball.radius <= paddleTop + paddle.height) {
          if (ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
            const hitOffset = ball.x - (paddle.x + paddle.width / 2);
            const normalized = hitOffset / (paddle.width / 2);
            ball.dx = normalized * ball.speed * 0.85;
            ball.dy = -Math.sqrt(Math.max(4, ball.speed * ball.speed - ball.dx * ball.dx));
            ball.y = paddleTop - ball.radius;
          }
        }

        if (ball.y + ball.radius > canvas.height) {
          if (config.godMode) {
            ball.y = canvas.height - ball.radius;
            ball.dy = -ball.dy;
            spawnExplosion(ball.x, canvas.height - 10, "#00ffff", 10);
          } else {
            currentLives--;
            saveGameState();
            if (currentLives <= 0) {
              triggerGameOver();
            } else {
              mcp.updateModelContext(`[BREAKOUT GAME EVENT: LIFE_LOST] Ball dropped! Remaining lives: ${currentLives}.`);
              resetBallPaddle();
            }
          }
        }

        let activeBricks = 0;
        for (let c = 0; c < brickColumnCount; c++) {
          for (let r = 0; r < brickRowCount; r++) {
            const b = bricks[c][r];
            if (b.status === 1) {
              activeBricks++;
              if (ball.x + ball.radius >= b.x && ball.x - ball.radius <= b.x + brickWidth &&
                  ball.y + ball.radius >= b.y && ball.y - ball.radius <= b.y + brickHeight) {
                
                const fromLeft = Math.abs((ball.x + ball.radius) - b.x);
                const fromRight = Math.abs((ball.x - ball.radius) - (b.x + brickWidth));
                const fromTop = Math.abs((ball.y + ball.radius) - b.y);
                const fromBottom = Math.abs((ball.y - ball.radius) - (b.y + brickHeight));
                const minDiff = Math.min(fromLeft, fromRight, fromTop, fromBottom);

                if (minDiff === fromTop || minDiff === fromBottom) {
                  ball.dy = -ball.dy;
                } else {
                  ball.dx = -ball.dx;
                }

                b.status = 0;
                score += b.points;
                saveGameState();
                spawnExplosion(b.x + brickWidth / 2, b.y + brickHeight / 2, b.color, 14);

                if (score - lastSentScore >= 100) {
                  lastSentScore = Math.floor(score / 100) * 100;
                  mcp.updateModelContext(`[BREAKOUT GAME EVENT: SCORE_UPDATE] Player reached ${score} points!`);
                }
                break;
              }
            }
          }
        }

        if (activeBricks === 0 && !gameWon) {
          winLevel();
        }
      } else {
        ball.x = paddle.x + paddle.width / 2;
        ball.y = paddle.y - ball.radius - 2;
        if (config.autopilot && !isPaused && !isSettingsOpen) {
          launchBall();
        }
      }
    }

    // Render Function
    function render() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, brickWidth, brickHeight);
          }
        }
      }

      ctx.fillStyle = config.godMode ? '#00ffff' : '#ffffff';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ball.x - ball.radius, ball.y - ball.radius, ball.radius * 2, ball.radius * 2);

      drawParticles();

      // Retro Scoreboard
      ctx.fillStyle = "#ffffff";
      ctx.font = "20px 'Courier New', Courier, monospace";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE: ${score.toString().padStart(4, '0')}`, 24, 42);

      ctx.textAlign = "center";
      ctx.fillText(`LIVES: ${currentLives}`, canvas.width / 2, 42);

      ctx.textAlign = "right";
      ctx.fillText(`HI: ${highScore.toString().padStart(4, '0')}`, canvas.width - 24, 42);

      ctx.fillStyle = "#333333";
      ctx.fillRect(24, 60, canvas.width - 48, 2);

      // Overlays
      if (gameOver) {
        drawOverlay("GAME OVER", "CLICK OR PRESS SPACE TO START NEW GAME");
      } else if (gameWon) {
        drawOverlay("LEVEL CLEARED!", "CLICK OR PRESS SPACE FOR NEXT LEVEL");
      } else if (isPaused && !isSettingsOpen) {
        if (!ball.active) {
          if (isResumedSession) {
            drawOverlay("GAME RESUMED!", `SCORE: ${score} | LEVEL: ${level} • PRESS SPACE TO LAUNCH`);
          } else {
            drawOverlay("READY!", "PRESS SPACE OR CLICK CANVAS TO LAUNCH");
          }
        } else {
          drawOverlay("PAUSED", "PRESS SPACE TO RESUME");
        }
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff0040";
      ctx.font = "bold 30px 'Courier New', Courier, monospace";
      ctx.textAlign = "center";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 15);

      ctx.fillStyle = "#ffffff";
      ctx.font = "14px 'Courier New', Courier, monospace";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 25);
    }

    // Delta-Time Game Loop
    let lastFrameTime = performance.now();
    function gameLoop(now) {
      const deltaMs = now - lastFrameTime;
      lastFrameTime = now;
      const dt = Math.min(Math.max(deltaMs / 16.667, 0.1), 2.0);

      updatePhysics(dt);
      updateParticles(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    // Initialize State
    const hasSavedState = loadGameState();
    if (!hasSavedState) {
      initBricks();
      resetBallPaddle();
    } else {
      resetBallPaddle();
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
